English:
  system_instruction: |-
    The following are multiple choice questions (with answers) about {subject}.
    Each question has four options labeled A, B, C, and D. Provide only a JSON object in the format {"answer": "X"}, where X is the uppercase letter corresponding to the correct option. Do not return any explanations or additional text.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"answer": "'
  assistant_template: '{"answer": "{answer}"}'

Italian:
  system_instruction: |-
    Di seguito sono riportate domande a risposta multipla (con risposte) su {subject}.
    Ogni domanda presenta quattro opzioni etichettate A, B, C e D. Fornire esclusivamente un oggetto JSON nel formato {"risposta": "X"}, dove X è la lettera maiuscola corrispondente all'opzione corretta. Non restituire spiegazioni o testo aggiuntivo.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"risposta": "'
  assistant_template: '{"risposta": "{answer}"}'

Friulian:
