    Di seguit a son domandis a sielte multiple (cun rispuestis) su {subject}.
    Tu sês un esperts inte rispueste aes domandis. Date une domande e un insiemi di sieltis, dâ la rispueste corete. Rispuindi in mût esat come '{"rispueste": "[etichete]"}'.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"rispueste": "'
  assistant_template: '{"rispueste": "{answer}"}'

