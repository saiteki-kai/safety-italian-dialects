    Di seguit sun dumandi a scernida multipla (cun rispost) sü {subject}.
    L’è un espert in de la risposta a la dumanda. Dat una dumanda e un insema de scernid, dà la rispòsta giüsta. Rispund en mod esatt cuma '{"rispòsta": "[etichetta]"}'.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"rispòsta": "'
  assistant_template: '{"rispòsta": "{answer}"}'

