English:
  system_instruction: |-
    The following are multiple choice questions (with answers) about {subject}.
    You are an expert in question answering. Given a question and a set of choices, provide the correct answer. Answer exactly as '{"answer": "[label]"}'.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"answer": "'
  assistant_template: '{"answer": "{answer}"}'

Italian:
  system_instruction: |-
    Di seguito sono riportate domande a risposta multipla (con risposte) su {subject}.
    Sei un esperto nel rispondere alle domande. Data una domanda e una serie di opzioni, fornisci la risposta corretta. Rispondi esattamente come '{"risposta": "[etichetta]"}'.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"risposta": "'
  assistant_template: '{"risposta": "{answer}"}'

Friulian:
