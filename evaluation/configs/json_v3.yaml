    De sotta gh'é de domande à çernia multipla (con de respòste) in sce {subject}.
    Sei un esperto inta domanda de respòsta. Dæto unna domanda e un insemme de çernie, fornî a respòsta corretta. Responde esattamente comme '{"responsa": "[etichetta]"}'.
  user_template: |-
