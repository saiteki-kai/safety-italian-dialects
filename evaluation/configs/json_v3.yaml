    Tu sì n'espertu nnâ risposta â dumanna. Data 'na dumanna e 'n 'nzèmi ri scelti, furnisci a risposta giusta. Rispunni esattamenti comu '{"risposta": "[etichetta]"}'.
  user_template: |-
    {question}
    {choices}
  assistant_prefill: '{"risposta": "'
  assistant_template: '{"risposta": "{answer}"}'

Ligurian:
