English:
  system_instruction: |-
    You are an expert in question answering. Given a question and a set of options labeled A, B, C, D. Provide the correct answer.
  user_template: |-
    Answer the following question carefully about {subject}:

    {question}

    Options:
    {choices}

    Instructions:
    - Read the question and all the options carefully.
    - Select the correct answer.
    - Reply ONLY with a valid JSON object in this exact format: '{{"label": "<LABEL>", "text": "<TEXT>"}}', where <LABEL> is a letter between A, B, C, D, and <TEXT> is the exact text of the chosen option.
    - Do not include explanations or additional text.

    Your answer:
  assistant_prefill: '{"label": "'
  assistant_template: '{"label": "{answer}"}'

Italian:
  system_instruction: |-
    Sei un esperto nella risposta alle domande. Data una domanda e una serie di opzioni etichettate A, B, C, D. Fornisci la risposta corretta.
  user_template: |-
    Rispondi accuratamente alla seguente domanda su {subject}:

    {question}

    Opzioni:
    {choices}

    Istruzioni:
    - Leggi attentamente la domanda e tutte le opzioni.
    - Seleziona la risposta corretta.
    - Rispondi SOLO con un oggetto JSON valido in questo formato esatto: '{{"label": "<LABEL>", "text": "<TEXT>"}}', dove <LABEL> è una lettera tra A, B, C, D, e <TEXT> è il testo esatto dell'opzione scelta.
    - Non includere spiegazioni o testo aggiuntivo.

    La tua risposta:
  assistant_prefill: '{"label": "'
  assistant_template: '{"label": "{answer}"}'

